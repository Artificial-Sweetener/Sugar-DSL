[build-system]
requires = ["setuptools>=77", "wheel", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "sugar-dsl"
dynamic = ["version"]
description = "Composable cube-based workflow system for ComfyUI"
authors = [
  { name = "Artificial Sweetener", email = "artificialsweetenerai@proton.me" },
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build",
  "mypy",
  "pytest",
  "pytest-xdist",
  "python-semantic-release",
  "ruff",
]

[project.urls]
Homepage = "https://artificialsweetener.ai"
Repository = "https://github.com/Artificial-Sweetener/Sugar-DSL"
Issues = "https://github.com/Artificial-Sweetener/Sugar-DSL/issues"

[tool.setuptools.packages.find]
include = ["sugar", "sugar.*"]

[tool.setuptools]
zip-safe = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
extend-select = ["B905"]

[tool.setuptools_scm]
write_to = "sugar/_version.py"
fallback_version = "0.8.0"

[tool.semantic_release]
version_toml = []
version_variables = []
commit_message = "chore: automatically advance version to {version}\n\nAutomatically generated by python-semantic-release"
commit_parser = "conventional"
logging_use_named_masks = false
major_on_zero = true
allow_zero_version = false
tag_format = "v{version}"

[tool.semantic_release.changelog]
mode = "update"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.branches.main]
match = "(main|master)"
prerelease_token = "rc"
prerelease = false
